name: grocy
summary: Grocy
description: Groceries Management
grade: stable

apps:
  php-fpm:
    user: grocy
    command: bin/service.php-fpm.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s
    before: [nginx]

  nginx:
    user: grocy
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  php:
    command: bin/php-runner

  cli:
    command: bin/cli

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start
